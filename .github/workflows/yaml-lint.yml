---
name: Network Automation CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run yamllint
        run: yamllint .

      - name: Run Ansible syntax checks
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook \
              -i inventories/lab/hosts.yml \
              "$playbook" \
              --syntax-check
          done

      - name: Run topology validation
        run: >-
          ansible-playbook
          -i inventories/lab/hosts.yml
          playbooks/validate_topology.yml

      - name: Generate device configurations
        run: >-
          ansible-playbook
          -i inventories/lab/hosts.yml
          playbooks/build_configs.yml

      - name: Check generated configurations are committed
        run: |
          git diff --exit-code -- configs/ lab/fabric.clab.yml
          config_status=$(git status --porcelain -uall -- \
            configs/ lab/fabric.clab.yml)
          if [ -n "$config_status" ]; then
            echo "Generated configs differ from Git. Regenerate and commit."
            git status --short --untracked-files=all -- \
              configs/ lab/fabric.clab.yml
            exit 1
          fi
