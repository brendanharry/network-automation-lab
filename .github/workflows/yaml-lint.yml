---
name: YAML Lint

"on":
  pull_request:
    branches:
      - main

jobs:
  yaml-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Install Ansible
        run: pip install ansible-core

      - name: Run Ansible syntax check
        run: >-
          ansible-playbook
          -i inventories/lab/hosts.yml
          playbooks/build_configs.yml
          --syntax-check

      - name: Run topology validation
        run: >-
          ansible-playbook
          -i inventories/lab/hosts.yml
          playbooks/validate_topology.yml
