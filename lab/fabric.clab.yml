---

name: fabric

topology:
  nodes:
    leaf01:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../configs/leaf01.cfg:/etc/frr/frr.conf
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf

    leaf02:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../configs/leaf02.cfg:/etc/frr/frr.conf
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf

    spine01:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../configs/spine01.cfg:/etc/frr/frr.conf
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf

    spine02:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../configs/spine02.cfg:/etc/frr/frr.conf
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf

  links:
    - endpoints: ["leaf01:swp1", "spine01:swp1"]
    - endpoints: ["leaf01:swp2", "spine02:swp1"]
    - endpoints: ["leaf02:swp1", "spine01:swp2"]
    - endpoints: ["leaf02:swp2", "spine02:swp2"]
