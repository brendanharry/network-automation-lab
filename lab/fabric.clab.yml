        - ../configs/leaf02.cfg:/etc/frr/frr.conf
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf

    spine01:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../configs/spine01.cfg:/etc/frr/frr.conf
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf

    spine02:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../configs/spine02.cfg:/etc/frr/frr.conf
        - frr/daemons:/etc/frr/daemons
        - frr/vtysh.conf:/etc/frr/vtysh.conf

    host01:
      kind: linux
      image: alpine:3.22.5
      cmd: sleep infinity

    host02:
      kind: linux
      image: alpine:3.22.5
