  links:
    - endpoints: ["leaf01:swp1", "spine01:swp1"]
    - endpoints: ["leaf01:swp2", "spine02:swp1"]
    - endpoints: ["leaf02:swp1", "spine01:swp2"]
    - endpoints: ["leaf02:swp2", "spine02:swp2"]
