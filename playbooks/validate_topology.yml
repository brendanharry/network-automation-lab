---
- name: Validate network topology
  hosts:
    - leafs
    - spines
  connection: local
  gather_facts: false

  vars:
    fabric_hosts: "{{ groups['leafs'] + groups['spines'] }}"
    ipv4_octet: '(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])'
    ipv4_pattern: '{{ ipv4_octet }}(?:\.{{ ipv4_octet }}){3}'

  tasks:
    - name: Check fabric connectivity
      ansible.builtin.assert:
        that:
          - underlay_interfaces | default([]) | length == 2
        fail_msg: >-
            {{ inventory_hostname }} must have exactly two underlay interfaces.
        success_msg: >-
            {{ inventory_hostname }} underlay topology data is valid.

    - name: Check ASN is a positive integer
      ansible.builtin.assert:
        that:
          - asn is defined
          - asn is integer
          - asn > 0
        fail_msg: >-
          {{ inventory_hostname }} must have a positive integer ASN.

    - name: Check underlay interface names are unique within each device
      ansible.builtin.assert:
        that:
          - >-
            underlay_interfaces | map(attribute='name') | list | length ==
            underlay_interfaces | map(attribute='name')
            | unique(case_sensitive=true) | length
        fail_msg: >-
          {{ inventory_hostname }} has duplicate underlay interface names.

    - name: Check underlay peers and IPv4 addressing format
      ansible.builtin.assert:
        that:
          - item.peer in fabric_hosts
          - item.ip is string
          - item.ip is match('^' ~ ipv4_pattern ~ '/31$')
          - item.peer_ip is string
          - item.peer_ip is match('^' ~ ipv4_pattern ~ '$')
        fail_msg: >-
          {{ inventory_hostname }} interface {{ item.name }} must reference
          a fabric peer and use an IPv4 /31 address and a bare IPv4 peer_ip.
      loop: "{{ underlay_interfaces }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check local and peer addresses belong to the same /31 subnet
      vars:
        local_octets: >-
          {{ item.ip.split('/')[0].split('.') | map('int') | list }}
        peer_octets: "{{ item.peer_ip.split('.') | map('int') | list }}"
      ansible.builtin.assert:
        that:
          - local_octets[:3] == peer_octets[:3]
          # A /31 pairs adjacent addresses with the same last-octet quotient.
          - local_octets[3] // 2 == peer_octets[3] // 2
          - local_octets[3] != peer_octets[3]
        fail_msg: >-
          {{ inventory_hostname }} interface {{ item.name }} must use
          distinct local and peer addresses in the same /31 subnet.
      loop: "{{ underlay_interfaces }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check each underlay link has exactly one reciprocal definition
      vars:
        reciprocal_links: >-
          {{
            hostvars[item.peer].underlay_interfaces | default([])
            | selectattr('peer', 'equalto', inventory_hostname)
            | selectattr('ip', 'equalto', item.peer_ip ~ '/31')
            | selectattr('peer_ip', 'equalto', item.ip.split('/')[0])
            | list
          }}
      ansible.builtin.assert:
        that:
          - reciprocal_links | length == 1
        fail_msg: >-
          {{ inventory_hostname }} interface {{ item.name }} must have exactly
          one reciprocal link on {{ item.peer }} pointing back to
          {{ inventory_hostname }} with the local and peer addresses swapped.
      loop: "{{ underlay_interfaces }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.peer }}"

- name: Validate fabric addressing
  hosts: localhost
  gather_facts: false

  vars:
    fabric_hosts: "{{ groups['leafs'] + groups['spines'] }}"
    loopback_ips: >-
      {{
        fabric_hosts
        | map('extract', hostvars, 'loopback_ip')
        | list
      }}

    underlay_ips: >-
      {{
        fabric_hosts
        | map('extract', hostvars, 'underlay_interfaces')
        | map('map', attribute='ip')
        | map('list')
        | flatten
      }}

  tasks:
    - name: Check for duplicate loopback addresses
      ansible.builtin.assert:
        that:
          - loopback_ips | length == loopback_ips | unique | length
        fail_msg: "Duplicate loopback IP addresses detected."
        success_msg: "All loopback IP addresses are unique."

    - name: Check for duplicate underlay addresses
      ansible.builtin.assert:
        that:
          - underlay_ips | length == underlay_ips | unique | length
        fail_msg: "Duplicate underlay IP addresses detected."
        success_msg: "All underlay IP addresses are unique."

- name: Validate tenant and host attachments
  hosts: localhost
  gather_facts: false
  vars:
    ipv4_octet: '(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])'
  tasks:
    - name: Check the RT administrator fits the two-octet ASN encoding
      ansible.builtin.assert:
        that:
          - evpn_rt_admin is integer
          - evpn_rt_admin >= 0 and evpn_rt_admin <= 65535
        fail_msg: EVPN RT administrator must be a 16-bit integer.

    - name: Check tenant VRF and VNI uniqueness
      ansible.builtin.assert:
        that:
          - tenant.name is match('^[a-z][a-z0-9-]{0,14}$')
          - tenant.l3_vni is integer
          - tenant.l3_vni >= 1 and tenant.l3_vni <= 16777215
          - tenant.table is integer and tenant.table > 255
          - tenant.l3_vni not in (segments | map(attribute='vni') | list)
          - >-
              segments | map(attribute='vni') | unique | length == segments |
              length
          - >-
              segments | map(attribute='vlan') | unique | length == segments |
              length
          - >-
              segments | map(attribute='name') | unique | length == segments |
              length
          - >-
              segments | map(attribute='subnet') | unique | length == segments |
              length
          - >-
            l3_bridge not in (segments | map(attribute='vlan') | map('string')
              | map('regex_replace', '^', 'br') | list)
          - >-
            tenant.name not in (['lo', 'eth0', l3_bridge, l3_vxlan]
              + (segments | map(attribute='vlan') | map('string')
                 | map('regex_replace', '^', 'br') | list)
              + (segments | map(attribute='vni') | map('string')
                 | map('regex_replace', '^', 'vxlan') | list))
          - tenant.gateway_mac is match('^02(:[0-9a-f]{2}){5}$')
          - >-
            groups['leafs'] | map('extract', hostvars, 'router_mac')
            | unique | length == groups['leafs'] | length
          - >-
            tenant.gateway_mac not in
            (groups['leafs'] | map('extract', hostvars, 'router_mac') | list)

    - name: Check L2 segments
      ansible.builtin.assert:
        that:
          - item.vlan is integer
          - item.vlan >= 1 and item.vlan <= 4094
          - item.vni is integer
          - item.vni >= 1 and item.vni <= 16777215
          - tenant.mtu is integer
          - tenant.mtu >= 1280 and tenant.mtu <= 9000
          - >-
            item.subnet is match(
              '^' ~ ipv4_octet ~ '\.' ~ ipv4_octet ~ '\.'
              ~ ipv4_octet ~ '\.0/24$')
          - item.tenant == tenant.name
          - item.leaves | length > 0
          - item.leaves | difference(groups['leafs']) | length == 0
          - item.leaves | unique | length == item.leaves | length
          - >-
            item.gateway is match(
              '^' ~ ipv4_octet ~ '(\.' ~ ipv4_octet ~ '){3}/24$')
          - item.gateway.split('/')[1] == '24'
          - >-
              item.gateway.split('/')[0].split('.')[:3] ==
              item.subnet.split('.')[0:3]
          - item.gateway.split('/')[0].split('.')[3] | int > 0
          - item.gateway.split('/')[0].split('.')[3] | int < 255
        fail_msg: >-
          Each tenant segment requires a valid VLAN/VNI, /24 and gateway.
      loop: "{{ segments }}"

    - name: Check VTEP addresses reuse leaf loopbacks
      ansible.builtin.assert:
        that:
          - hostvars[item].vtep_source == hostvars[item].loopback_ip
          - >-
            hostvars[item].vtep_source is match(
              '^' ~ ipv4_octet ~ '(\.' ~ ipv4_octet ~ '){3}$')
      loop: "{{ groups['leafs'] }}"

    - name: Check host attachment and addressing
      vars:
        host: "{{ hostvars[item] }}"
        host_segment: >-
          {{ segments | selectattr('name', 'equalto', host.segment) | first }}
      ansible.builtin.assert:
        that:
          - host.segment in (segments | map(attribute='name') | list)
          - host.attachment.leaf in host_segment.leaves
          - host.ip_address != host_segment.gateway.split('/')[0]
          - host.attachment.leaf_interface is match('^swp[0-9]+$')
          - host.attachment.leaf_interface | length <= 15
          - >-
            host.attachment.leaf_interface not in
            (hostvars[host.attachment.leaf].underlay_interfaces
             | map(attribute='name') | list)
          - host.attachment.interface is match('^eth[1-9][0-9]*$')
          - host.attachment.interface | length <= 15
          - >-
            host.ip_address is match(
              '^' ~ ipv4_octet ~ '(\.' ~ ipv4_octet ~ '){3}$')
          - >-
            host.ip_address.split('.')[:3]
            == host_segment.subnet.split('/')[0].split('.')[:3]
          - host.ip_address.split('.')[3] | int > 0
          - host.ip_address.split('.')[3] | int < 255
          - host.mac_address != tenant.gateway_mac
          - >-
            host.mac_address not in (groups['leafs']
              | map('extract', hostvars, 'router_mac') | list)
          - host.mac_address is match('^02(:[0-9a-f]{2}){5}$')
      loop: "{{ groups['test_hosts'] }}"

    - name: Check host identities are unique and cover both leaves
      vars:
        test_host_data: >-
          {{ groups['test_hosts'] | map('extract', hostvars) | list }}
      ansible.builtin.assert:
        that:
          - >-
              test_host_data | map(attribute='ip_address') | unique | length ==
              groups['test_hosts'] | length
          - >-
              test_host_data | map(attribute='mac_address') | unique | length ==
              groups['test_hosts'] | length
          - >-
            test_host_data | map(attribute='attachment.leaf') | list
            | symmetric_difference(groups['leafs']) | length == 0

    - name: Check attachment ports do not collide
      vars:
        local_hosts: >-
          {{ groups['test_hosts'] | map('extract', hostvars)
             | selectattr('attachment.leaf', 'equalto', item) | list }}
      ansible.builtin.assert:
        that:
          - >-
            local_hosts | map(attribute='attachment.leaf_interface')
            | unique | length == local_hosts | length
          - hostvars[item].router_mac is match('^02(:[0-9a-f]{2}){5}$')
      loop: "{{ groups['leafs'] }}"
