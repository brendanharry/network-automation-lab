---
- name: Validate network topology
  hosts:
    - leafs
    - spines
  connection: local
  gather_facts: false

  tasks:
    - name: Check fabric connectivity
      ansible.builtin.assert:
        that:
          - underlay_interfaces | default([]) | length == 2
          - bgp_neighbors | default([]) | length == 2
        fail_msg: >-
          {{ inventory_hostname }} must have exactly two underlay interfaces
          and two BGP neighbors.
        success_msg: >-
          {{ inventory_hostname }} topology data is valid.

    - name: Check underlay and BGP peers match
      ansible.builtin.assert:
        that:
          - >-
            underlay_interfaces
            | map(attribute='peer')
            | sort
            | list
            ==
            bgp_neighbors
            | map(attribute='name')
            | sort
            | list
        fail_msg: >-
          {{ inventory_hostname }} underlay peers do not match
          its BGP neighbors.
        success_msg: >-
          {{ inventory_hostname }} underlay and BGP peers match.

    - name: Check BGP remote AS values
      ansible.builtin.assert:
        that:
          - neighbor.remote_as == hostvars[neighbor.name].asn
        fail_msg: >-
          {{ inventory_hostname }} has incorrect remote AS for
          {{ neighbor.name }}.
        success_msg: >-
          {{ inventory_hostname }} remote AS for
          {{ neighbor.name }} is correct.
      loop: "{{ bgp_neighbors }}"
      loop_control:
        loop_var: neighbor

- name: Validate fabric addressing
  hosts: localhost
  gather_facts: false

  vars:
    fabric_hosts: "{{ groups['leafs'] + groups['spines'] }}"
    loopback_ips: >-
      {{
        fabric_hosts
        | map('extract', hostvars, 'loopback_ip')
        | list
      }}

    underlay_ips: >-
      {{
        fabric_hosts
        | map('extract', hostvars, 'underlay_interfaces')
        | map('map', attribute='ip')
        | map('list')
        | flatten
      }}

  tasks:
    - name: Check for duplicate loopback addresses
      ansible.builtin.assert:
        that:
          - loopback_ips | length == loopback_ips | unique | length
        fail_msg: "Duplicate loopback IP addresses detected."
        success_msg: "All loopback IP addresses are unique."

    - name: Check for duplicate underlay addresses
      ansible.builtin.assert:
        that:
          - underlay_ips | length == underlay_ips | unique | length
        fail_msg: "Duplicate underlay IP addresses detected."
        success_msg: "All underlay IP addresses are unique."
