---
- name: Validate running fabric
  hosts: localhost
  gather_facts: false

  vars:
    fabric_nodes: "{{ groups['leafs'] | union(groups['spines']) }}"
    expected_loopback_prefixes: >-
      {{ fabric_nodes
         | map('extract', hostvars, 'loopback_ip')
         | map('regex_replace', '$', '/32')
         | list }}
    connectivity_tests: >-
      {{ (groups['leafs'] | permutations(2) | list)
         + (groups['spines'] | permutations(2) | list) }}

  tasks:
    - name: Read BGP neighbors as JSON
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "clab-fabric-{{ item }}"
          - vtysh
          - -c
          - show bgp neighbors json
      loop: "{{ fabric_nodes }}"
      register: bgp_neighbor_results
      changed_when: false
      failed_when: false
      until: >-
        bgp_neighbor_results.rc == 0
        and bgp_neighbor_results.stdout | trim | length > 0
        and (bgp_neighbor_results.stdout | from_json) is mapping
        and hostvars[item].underlay_interfaces
        | map(attribute='peer_ip')
        | difference(
            bgp_neighbor_results.stdout
            | from_json
            | dict2items
            | selectattr('value.bgpState', 'equalto', 'Established')
            | map(attribute='key')
            | list
          )
        | length == 0
      retries: 12
      delay: 2
      # Let the assertions below report failures after retries are exhausted.
      ignore_errors: true

    - name: Verify the expected BGP neighbors and remote ASNs
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout | trim | length > 0
          - (item.stdout | from_json) is mapping
          - >-
            hostvars[item.item].underlay_interfaces
            | map(attribute='peer_ip')
            | symmetric_difference((item.stdout | from_json).keys() | list)
            | length == 0
          - >-
            hostvars[item.item].underlay_interfaces
            | map(attribute='peer_ip')
            | map('extract', item.stdout | from_json)
            | map(attribute='bgpState')
            | unique
            | list == ['Established']
          - >-
            hostvars[item.item].underlay_interfaces
            | map(attribute='peer_ip')
            | map('extract', item.stdout | from_json)
            | map(attribute='remoteAs')
            | map('int')
            | list
            == hostvars[item.item].underlay_interfaces
               | map(attribute='peer')
               | map('extract', hostvars, 'asn')
               | map('int')
               | list
        fail_msg: >-
          {{ item.item }} does not have exactly the expected Established BGP
          neighbors with inventory-defined remote ASNs.
          Command rc={{ item.rc }};
          stderr={{ item.stderr | default('') | trim | to_json }};
          stdout={{ item.stdout | default('') | trim | to_json }}.
        success_msg: >-
          {{ item.item }} has exactly the expected Established BGP neighbors
          with inventory-defined remote ASNs.
      loop: "{{ bgp_neighbor_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the IPv4 unicast BGP table as JSON
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "clab-fabric-{{ item }}"
          - vtysh
          - -c
          - show bgp ipv4 unicast json
      loop: "{{ fabric_nodes }}"
      register: bgp_route_results
      changed_when: false
      failed_when: false
      until: >-
        bgp_route_results.rc == 0
        and bgp_route_results.stdout | trim | length > 0
        and (bgp_route_results.stdout | from_json) is mapping
        and (bgp_route_results.stdout | from_json).routes is mapping
        and expected_loopback_prefixes
        | difference(
            (bgp_route_results.stdout | from_json).routes.keys() | list
          )
        | length == 0
      retries: 12
      delay: 2
      # Let the assertion below report failures after retries are exhausted.
      ignore_errors: true

    - name: Verify every expected loopback is in the BGP table
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout | trim | length > 0
          - (item.stdout | from_json) is mapping
          - (item.stdout | from_json).routes is mapping
          - >-
            expected_loopback_prefixes
            | difference((item.stdout | from_json).routes.keys() | list)
            | length == 0
        fail_msg: >-
          {{ item.item }} is missing one or more inventory-defined loopback
          prefixes from its BGP table. Command rc={{ item.rc }};
          stderr={{ item.stderr | default('') | trim | to_json }};
          stdout={{ item.stdout | default('') | trim | to_json }}.
        success_msg: >-
          {{ item.item }} has every inventory-defined loopback prefix in its
          BGP table.
      loop: "{{ bgp_route_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read BGP routes installed in the Linux routing table
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "clab-fabric-{{ item }}"
          - ip
          - -j
          - -4
          - route
          - show
          - protocol
          - bgp
      loop: "{{ fabric_nodes }}"
      register: linux_route_results
      changed_when: false
      failed_when: false
      until: >-
        linux_route_results.rc == 0
        and linux_route_results.stdout | trim | length > 0
        and (linux_route_results.stdout | from_json) is sequence
        and (linux_route_results.stdout | from_json) is not string
        and fabric_nodes
        | reject('equalto', item)
        | map('extract', hostvars, 'loopback_ip')
        | difference(
            linux_route_results.stdout
            | from_json
            | map(attribute='dst')
            | list
          )
        | length == 0
      retries: 12
      delay: 2
      # Let the assertion below report failures after retries are exhausted.
      ignore_errors: true

    - name: Verify remote loopbacks are installed in the Linux routing table
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout | trim | length > 0
          - (item.stdout | from_json) is sequence
          - (item.stdout | from_json) is not string
          - >-
            fabric_nodes
            | reject('equalto', item.item)
            | map('extract', hostvars, 'loopback_ip')
            | difference(
                item.stdout | from_json | map(attribute='dst') | list
              )
            | length == 0
        fail_msg: >-
          {{ item.item }} is missing one or more remote loopbacks from its
          Linux BGP routing table. Command rc={{ item.rc }};
          stderr={{ item.stderr | default('') | trim | to_json }};
          stdout={{ item.stdout | default('') | trim | to_json }}.
        success_msg: >-
          {{ item.item }} has every remote loopback installed as a Linux BGP
          route.
      loop: "{{ linux_route_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Test loopback reachability
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "clab-fabric-{{ item.0 }}"
          - ping
          - -I
          - "{{ hostvars[item.0].loopback_ip }}"
          - -c
          - "2"
          - -w
          - "5"
          - "{{ hostvars[item.1].loopback_ip }}"
      loop: "{{ connectivity_tests }}"
      register: ping_results
      changed_when: false
      failed_when: false
      loop_control:
        label: >-
          {{ item.0 }} to {{ hostvars[item.1].loopback_ip }}

    - name: Verify loopback reachability
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: >-
          {{ item.item.0 }} cannot reach
          {{ hostvars[item.item.1].loopback_ip }}.
        success_msg: >-
          {{ item.item.0 }} can reach
          {{ hostvars[item.item.1].loopback_ip }}.
      loop: "{{ ping_results.results }}"
      loop_control:
        label: >-
          {{ item.item.0 }} to {{ hostvars[item.item.1].loopback_ip }}
