---
- name: Configure leaf Linux VRF and VXLAN interfaces
  hosts: leafs
  connection: local
  gather_facts: false
  vars:
    container: "clab-fabric-{{ inventory_hostname }}"
  tasks:
    - name: Read existing Linux interfaces
      ansible.builtin.command:
        argv: [docker, exec, "{{ container }}", ip, -j, link, show]
      register: existing_links
      changed_when: false

    - name: Create tenant VRF if absent
      ansible.builtin.command:
        argv: [docker, exec, "{{ container }}", ip, link, add,
               "{{ tenant.name }}", type, vrf, table, "{{ tenant.table }}"]
      when: >-
        tenant.name not in
        (existing_links.stdout | from_json | map(attribute='ifname') | list)
      changed_when: true

    - name: Enable tenant routing
      ansible.builtin.command:
        argv: "{{ ['docker', 'exec', container] + item }}"
      loop:
        - [ip, link, set, "{{ tenant.name }}", up]
        - [sysctl, -w, net.ipv4.ip_forward=1]
        - [sysctl, -w, net.ipv4.conf.all.rp_filter=0]
        - [sysctl, -w, net.ipv4.conf.default.rp_filter=0]
      changed_when: true

    - name: Configure unnumbered L3 VNI with a unique router MAC
      ansible.builtin.include_tasks: tasks/configure_vni.yml
      vars:
        bridge_name: "{{ l3_bridge }}"
        vxlan_name: "{{ l3_vxlan }}"
        vni_id: "{{ tenant.l3_vni }}"
        bridge_mac: "{{ router_mac }}"

    - name: Configure local L2 segments and anycast gateways
      ansible.builtin.include_tasks: tasks/configure_vni.yml
      loop: >-
        {{ segments | selectattr('leaves', 'contains', inventory_hostname) }}
      loop_control:
        loop_var: l2_segment
        label: "{{ l2_segment.name }}"
      vars:
        bridge_name: "br{{ l2_segment.vlan }}"
        vxlan_name: "vxlan{{ l2_segment.vni }}"
        vni_id: "{{ l2_segment.vni }}"
        bridge_mac: "{{ tenant.gateway_mac }}"
        gateway_address: "{{ l2_segment.gateway }}"

    - name: Attach untagged host ports to their segment bridges
      vars:
        host_segment: >-
          {{ segments | selectattr('name', 'equalto', hostvars[item].segment)
             | first }}
      ansible.builtin.command:
        argv: [docker, exec, "{{ container }}", ip, link, set,
               "{{ hostvars[item].attachment.leaf_interface }}", master,
               "br{{ host_segment.vlan }}", addrgenmode, none,
               mtu, "{{ tenant.mtu }}", up]
      loop: "{{ groups['test_hosts'] }}"
      when: hostvars[item].attachment.leaf == inventory_hostname
      changed_when: true

- name: Configure test host interfaces and tenant routes
  hosts: test_hosts
  connection: local
  gather_facts: false
  vars:
    host_segment: >-
      {{ segments | selectattr('name', 'equalto', segment) | first }}
  tasks:
    - name: Configure deterministic host MAC and IP addresses and gateway
      ansible.builtin.command:
        argv: >-
          {{ ['docker', 'exec', 'clab-fabric-' + inventory_hostname] + item }}
      loop:
        - [ip, link, set, "{{ attachment.interface }}", address,
           "{{ mac_address }}", mtu, "{{ tenant.mtu }}", up]
        - [ip, address, replace,
           "{{ ip_address }}/{{ host_segment.subnet.split('/')[1] }}",
           dev, "{{ attachment.interface }}"]
        - [ip, route, replace, default, via,
           "{{ host_segment.gateway.split('/')[0] }}",
           dev, "{{ attachment.interface }}"]
      changed_when: true
